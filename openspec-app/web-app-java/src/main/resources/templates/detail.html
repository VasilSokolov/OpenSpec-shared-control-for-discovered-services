<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpsX Web Console</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<header class="navbar navbar-expand bg-dark border-bottom px-3" data-bs-theme="dark">
    <a class="navbar-brand mb-0 h1 text-decoration-none" th:href="@{/}">OpsX Web Console</a>
    <span class="navbar-text small text-truncate ms-2 flex-grow-1" th:text="${controlRootPath}">root</span>
</header>

<main class="container-fluid p-4">
    <a th:href="@{/}" class="link-secondary small">&larr; Back to board</a>

    <div id="gate-result"></div>
    <div id="board-notice"></div>

    <div th:if="${detailError}" class="alert alert-danger mt-3" th:text="${detailError}">error</div>

    <div th:if="${change}" class="mt-3">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h2 class="h4 mb-1">
                    <span th:text="${change.id()}">id</span>
                    <span th:if="${change.archived()}" class="badge text-bg-dark align-middle">archived</span>
                </h2>
                <p class="text-muted mb-2" th:if="${!#strings.isEmpty(change.title())}" th:text="${change.title()}">title</p>
                <div class="d-flex align-items-center gap-2">
                    <span th:replace="~{fragments :: approvalControl}"></span>
                    <span class="badge text-bg-light" th:text="${change.status()}">status</span>
                </div>
            </div>
            <div th:unless="${change.archived()}" class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-primary" type="button"
                        th:attr="hx-post=@{'/changes/' + ${change.id()} + '/validate'}"
                        hx-target="#gate-result" hx-swap="innerHTML">Validate</button>
                <button type="button" class="btn btn-outline-primary copy-cmd"
                        th:attr="data-copy='/opsx:apply ' + ${change.id()}">Copy apply</button>
                <button type="button" class="btn btn-outline-secondary copy-cmd"
                        th:attr="data-copy='/opsx:archive ' + ${change.id()}">Copy archive</button>
            </div>
        </div>

        <section class="mt-4">
            <h3 class="h6">Work items</h3>
            <table th:if="${!change.workItems().isEmpty()}" class="table table-sm align-middle">
                <thead>
                <tr><th>ID</th><th>Status</th><th>Module</th><th>Branch</th></tr>
                </thead>
                <tbody>
                <tr th:each="w : ${change.workItems()}">
                    <td th:text="${w.id()}">id</td>
                    <td><span class="badge text-bg-secondary" th:text="${w.status()}">status</span></td>
                    <td><code th:text="${w.moduleId()}">module</code></td>
                    <td th:text="${#strings.isEmpty(w.branch()) ? '—' : w.branch()}">branch</td>
                </tr>
                </tbody>
            </table>
            <p th:if="${change.workItems().isEmpty()}" class="text-muted">No work items.</p>
        </section>

        <section class="mt-4">
            <h3 class="h6">Evidence</h3>
            <ul th:if="${!change.evidence().isEmpty()}" class="list-unstyled">
                <li th:each="e : ${change.evidence()}">
                    <a href="#" class="link-primary"
                       th:attr="hx-get=@{'/changes/' + ${change.id()} + '/evidence'(path=${e})}"
                       hx-target="#evidence-view" hx-swap="innerHTML"
                       th:text="${e}">path</a>
                </li>
            </ul>
            <p th:if="${change.evidence().isEmpty()}" class="text-muted">No evidence files.</p>
            <div id="evidence-view"></div>
        </section>
    </div>
</main>

<script th:src="@{/webjars/htmx.org/2.0.3/dist/htmx.min.js}"></script>
<script>
    // textContent (never innerHTML) for the command, so a change id can never inject markup.
    function showNotice(cmd) {
        var n = document.getElementById('board-notice');
        if (!n) return;
        var div = document.createElement('div');
        div.className = 'alert alert-info d-flex align-items-center gap-2 mt-3';
        div.appendChild(document.createTextNode('Copied '));
        var code = document.createElement('code');
        code.textContent = cmd;
        div.appendChild(code);
        div.appendChild(document.createTextNode(' to the clipboard — run it in Claude Code or the terminal.'));
        n.replaceChildren(div);
        setTimeout(function () { if (n.firstChild === div) n.replaceChildren(); }, 5000);
    }

    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.copy-cmd');
        if (!btn) return;
        var cmd = btn.getAttribute('data-copy');
        navigator.clipboard.writeText(cmd).then(function () {
            var original = btn.textContent;
            btn.textContent = 'Copied!';
            showNotice(cmd);
            setTimeout(function () { btn.textContent = original; }, 1200);
        });
    });
</script>
</body>
</html>
