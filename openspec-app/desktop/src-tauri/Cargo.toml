[package]
name = "opsx-console"
version = "0.1.0"
description = "OpsX Console — desktop UI over the file-based OpenSpec control plane"
authors = ["Vasil Sokolov"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "opsx_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "6"
