type: object
required: [change_id, approved_revision, work_items]
properties:
  change_id: {type: string}
  approved_revision: {type: string}
  work_items:
    type: array
    items:
      type: object
      required: [id, repository_id, module_id, depends_on]
      properties:
        id: {type: string}
        repository_id: {type: string}
        module_id: {type: string}
        worktree: {type: string}
        depends_on: {type: array}
        agent: {type: string}
